<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>部首大挑戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7/dist/hanzi-writer.min.js"></script>
<style>
  :root{
    --bg1:#FFF6E9; --bg2:#FFE9D6; --card:#FFFFFF;
    --brown:#7A4A2B; --orange:#F2994A; --green:#2E9E6C;
    --blue:#3B82C4; --red:#E0554F; --yellow:#F4C542;
    --shadow: 0 6px 18px rgba(122,74,43,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    font-family:'Baloo 2', '標楷體', sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--brown);
  }
  .screen{ display:none; min-height:100vh; padding:24px 16px; flex-direction:column; align-items:center; }
  .screen.active{ display:flex; }
  h1{ font-size:23px; font-weight:800; margin:8px 0 4px; text-align:center; }
  .subtitle{ font-family:'Baloo 2', sans-serif; font-size:15px; color:#A98868; margin:0 0 20px; text-align:center; }
  .card{
    background:var(--card); border-radius:20px; box-shadow:var(--shadow);
    padding:20px; width:100%; max-width:420px;
  }
  input{
    width:100%; padding:14px; margin:8px 0; border-radius:12px;
    border:2px solid #EEDDC8; font-size:17px; font-family:inherit;
  }
  button{
    font-family:inherit; border:none; cursor:pointer;
  }
  .btn-primary{
    width:100%; padding:14px; margin-top:10px; border-radius:14px;
    background:var(--orange); color:#fff; font-size:18px; font-weight:700;
    box-shadow:0 4px 0 #C9762F;
  }
  .btn-primary:active{ transform:translateY(2px); box-shadow:0 2px 0 #C9762F; }
  .link-btn{ background:none; color:var(--blue); font-size:15px; margin-top:14px; text-decoration:underline; }
  .level-list{
    width:100%; max-width:460px; display:grid;
    grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:14px;
  }
  .level-card{
    background:var(--card); border-radius:18px; padding:18px;
    box-shadow:var(--shadow); cursor:pointer;
    border:2px solid var(--lv-color, #EEDDC8);
  }
  .level-icon{
    width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:20px; color:#fff; margin-bottom:12px; background:var(--lv-color, var(--orange));
  }
  .level-name{ font-size:19px; font-weight:800; margin-bottom:8px; }
  .level-badge{
    display:inline-block; background:#F1E4D0; color:var(--brown);
    font-size:13px; font-weight:600; border-radius:10px; padding:3px 10px; margin-bottom:8px;
  }
  .level-sub{ font-size:14px; color:#8A6F55; line-height:1.4; margin-bottom:10px; }
  .level-progress{ height:6px; background:#F1E4D0; border-radius:4px; overflow:hidden; margin-bottom:6px; }
  .level-progress-bar{ height:100%; background:var(--lv-color, var(--green)); border-radius:4px; }
  .level-status{ font-size:13px; color:#A98868; }

  @media (max-width:400px){
    .level-list{ grid-template-columns:1fr; }
  }

  .topbar{ width:100%; max-width:480px; display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .score-pill{ background:#fff; border-radius:20px; padding:8px 16px; box-shadow:var(--shadow); font-weight:700; font-size:15px; }
  .question-row{ display:flex; align-items:center; justify-content:center; gap:10px; margin:20px 0 0; }
  .question-row .speak-btn{ font-size:24px; }
  .question-pron{ text-align:center; font-size:16px; color:#8A6F55; margin:2px 0 10px; }
  .radical-question{ font-size:64px; font-weight:800; }
  .choices{ width:100%; max-width:420px; display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .choice-btn{
    padding:20px 8px; border-radius:16px; background:#fff; box-shadow:var(--shadow);
    font-size:26px; font-weight:700; color:var(--blue); border:2px solid transparent;
  }
  .choice-btn.correct{ border-color:var(--green); background:#EAFBF2; }
  .choice-btn.wrong{ border-color:var(--red); background:#FDECEC; }

  .reveal-card{ width:100%; max-width:420px; background:#fff; border-radius:20px; box-shadow:var(--shadow); padding:20px; margin-top:18px; }
  .reveal-char{ font-size:72px; font-weight:800; text-align:center; }
  .reveal-radical{
    text-align:center; margin:2px 0 10px;
  }
  .reveal-radical span{
    display:inline-block; background:#E7F0FA; color:#3B82C4;
    font-size:16px; font-weight:700; border-radius:10px; padding:4px 12px;
  }
  .stroke-box{ display:flex; justify-content:center; margin:10px 0; }
  .vocab-row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:14px 0; }
  .vocab-pill{
    display:flex; align-items:center; gap:6px; background:var(--bg1);
    border-radius:20px; padding:8px 14px; font-size:17px;
  }
  .speak-btn{ background:none; font-size:18px; padding:4px; }
  .sentence-box{ background:var(--bg1); border-radius:14px; padding:14px 16px; font-size:17px; line-height:1.6; display:flex; gap:10px; align-items:flex-start; }
  .next-btn{ width:100%; margin-top:16px; }

  .error-msg{ color:var(--red); font-size:14px; margin-top:6px; min-height:18px; }
  .streak-badge{ background:var(--yellow); border-radius:16px; padding:6px 12px; font-size:14px; font-weight:700; }
</style>
</head>
<body>

<!-- 登入畫面 -->
<div id="screen-login" class="screen active">
  <h1>部首大挑戰 Radical Challenge</h1>
  <p class="subtitle">Guess the radical, then watch the character come to life</p>
  <div class="card">
    <input id="login-username" placeholder="帳號 Username" autocomplete="username">
    <input id="login-password" type="password" placeholder="密碼 Password" autocomplete="current-password">
    <button class="btn-primary" onclick="doLogin()">登入 Log in</button>
    <div class="error-msg" id="login-error"></div>
    <button class="link-btn" onclick="showScreen('screen-register')">還沒有帳號？註冊 First time? Register</button>
  </div>
</div>

<!-- 註冊畫面 -->
<div id="screen-register" class="screen">
  <h1>建立帳號 Create Account</h1>
  <div class="card">
    <input id="reg-username" placeholder="帳號 Username">
    <input id="reg-password" type="password" placeholder="密碼 Password">
    <button class="btn-primary" onclick="doRegister()">註冊 Register</button>
    <div class="error-msg" id="register-error"></div>
    <button class="link-btn" onclick="showScreen('screen-login')">已經有帳號？登入 Already have an account? Log in</button>
  </div>
</div>

<!-- 關卡選擇 -->
<div id="screen-levels" class="screen">
  <h1>選擇關卡</h1>
  <div class="level-list" id="level-list"></div>
</div>

<!-- 遊戲畫面 -->
<div id="screen-game" class="screen">
  <div class="topbar">
    <span class="streak-badge" id="streak-badge">🔥 連對 0</span>
    <button class="link-btn" onclick="backToLevels()">← 返回</button>
  </div>
  <div class="question-row">
    <span class="radical-question" id="question-char">部</span>
    <button class="speak-btn" id="question-speak-btn" onclick="speakText(currentQuestion.char)">🔊</button>
  </div>
  <div class="question-pron" id="question-pron"></div>
  <div style="font-size:15px;color:#A98868;margin-bottom:8px;">這個字的部首是？</div>
  <div class="choices" id="choices"></div>

  <div class="reveal-card" id="reveal-card" style="display:none;">
    <div class="reveal-char" id="reveal-char"></div>
    <div class="reveal-radical" id="reveal-radical"></div>
    <div class="stroke-box"><div id="stroke-target" style="width:140px;height:140px;"></div></div>
    <div class="vocab-row" id="vocab-row"></div>
    <div class="sentence-box">
      <button class="speak-btn" onclick="speakText(currentSentence)">🔊</button>
      <span id="sentence-text"></span>
    </div>
    <button class="btn-primary next-btn" onclick="nextQuestion()">下一題 →</button>
  </div>
</div>

<script>

  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));

}

// ====== API 呼叫 ======
async function apiCall(action, payload){
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain' }, // 避免 CORS preflight
    body: JSON.stringify({ action, ...payload })
  });
  return res.json();
}

async function doLogin(){
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if(!username || !password){ errEl.textContent = '請輸入帳號與密碼 Please enter a username and password'; return; }
  try{
    const result = await apiCall('login', { username, password });
    if(result.success){
      currentUser = username;
      renderLevels();
      showScreen('screen-levels');
    } else {
      errEl.textContent = result.message || '帳號或密碼錯誤 Incorrect username or password';
    }
  } catch(e){
    errEl.textContent = '連線失敗，請稍後再試 Connection failed, please try again later';
  }
}

async function doRegister(){
  const username = document.getElementById('reg-username').value.trim();
  const password = document.getElementById('reg-password').value;
  const errEl = document.getElementById('register-error');
  errEl.textContent = '';
  if(!username || !password){ errEl.textContent = '請輸入帳號與密碼 Please enter a username and password'; return; }
  try{
    const result = await apiCall('register', { username, password });
    if(result.success){
      currentUser = username;
      renderLevels();
      showScreen('screen-levels');
    } else {
      errEl.textContent = result.message || '註冊失敗，帳號可能已被使用 Registration failed, username may be taken';
    }
  } catch(e){
    errEl.textContent = '連線失敗，請稍後再試 Connection failed, please try again later';
  }
}

// ====== 關卡選擇 ======
function renderLevels(){
  const list = document.getElementById('level-list');
  list.innerHTML = '';
  LEVELS.forEach(lv=>{
    const count = DATA.filter(d=>d.level===lv.id).length;
    const results = recentResults[lv.id];
    const acc = results.length ? Math.round(results.reduce((a,b)=>a+b,0)/results.length*100) : 0;
    const div = document.createElement('div');
    div.className = 'level-card';
    div.onclick = ()=> startLevel(lv.id);
    div.style.setProperty('--lv-color', lv.color);
    div.innerHTML = `
      <div class="level-icon">${LEVEL_ICONS[lv.icon]}</div>
      <div class="level-name">${lv.zh} ${lv.name}</div>
      <div class="level-badge">${count} 個字 ${count} chars</div>
      <div class="level-sub">${lv.desc}</div>
      <div class="level-progress"><div class="level-progress-bar" style="width:${acc}%"></div></div>
      <div class="level-status">近10題正確率 ${acc}% ${results.length ? '' : '· 尚未開始 Not started'}</div>`;
    list.appendChild(div);
  });
}

function startLevel(levelId){
  currentLevel = levelId;
  currentPool = DATA.filter(d=>d.level===levelId);
  score = 0; streak = 0;
  updateTopbar();
  showScreen('screen-game');
  nextQuestion();
}

function backToLevels(){
  renderLevels();
  showScreen('screen-levels');
}

function updateTopbar(){
  document.getElementById('streak-badge').textContent = `🔥 連對 ${streak}`;
}

// ====== 出題 ======
function nextQuestion(){
  document.getElementById('reveal-card').style.display = 'none';
  document.querySelector('.question-row').style.display = 'flex';
  document.getElementById('question-pron').style.display = 'block';
  document.querySelector('.choices').style.display = 'grid';

  const idx = Math.floor(Math.random()*currentPool.length);
  currentQuestion = currentPool[idx];
  document.getElementById('question-char').textContent = currentQuestion.char;
  document.getElementById('question-pron').textContent = `${currentQuestion.bopomofo}　${currentQuestion.pinyin}`;
  speakText(currentQuestion.char);

  // 產生四選一（正解 + 3 個干擾部首）
  const allRadicals = [...new Set(DATA.map(d=>d.radical))];
  const wrongPool = allRadicals.filter(r=>r!==currentQuestion.radical);
  const wrongs = [];
  while(wrongs.length < 3 && wrongPool.length){
    const i = Math.floor(Math.random()*wrongPool.length);
    wrongs.push(wrongPool.splice(i,1)[0]);
  }
  const options = [currentQuestion.radical, ...wrongs].sort(()=>Math.random()-0.5);

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt;
    btn.onclick = ()=> answer(opt, btn);
    choicesEl.appendChild(btn);
  });
}

function answer(opt, btnEl){
  const correct = opt === currentQuestion.radical;
  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.disabled = true;
    if(b.textContent === currentQuestion.radical) b.classList.add('correct');
    else if(b === btnEl && !correct) b.classList.add('wrong');
  });

  if(correct){ score++; streak++; } else { streak = 0; }
  recentResults[currentLevel].push(correct?1:0);
  if(recentResults[currentLevel].length > 10) recentResults[currentLevel].shift();
  updateTopbar();

  setTimeout(()=> revealDetail(), 500);
}

function revealDetail(){
  document.querySelector('.question-row').style.display = 'none';
  document.getElementById('question-pron').style.display = 'none';
  document.querySelector('.choices').style.display = 'none';

  const card = document.getElementById('reveal-card');
  card.style.display = 'block';
  document.getElementById('reveal-char').textContent = currentQuestion.char;
  document.getElementById('reveal-radical').innerHTML = `<span>部首：${currentQuestion.radical}</span>`;

  const vocabRow = document.getElementById('vocab-row');
  vocabRow.innerHTML = '';
  currentQuestion.words.forEach(w=>{
    const pill = document.createElement('div');
    pill.className = 'vocab-pill';
    pill.innerHTML = `<span>${w}</span><button class="speak-btn" onclick="speakText('${w.replace(/'/g,"\\'")}')">🔊</button>`;
    vocabRow.appendChild(pill);
  });

  currentSentence = currentQuestion.sentence;
  document.getElementById('sentence-text').textContent = currentSentence;

  drawStroke(currentQuestion.char, currentQuestion.radical);
}

// ====== 筆順動畫（三色：紅=首筆，藍=部首，綠=其餘） ======
function drawStroke(char, radical){
  const target = document.getElementById('stroke-target');
  target.innerHTML = '';
  const radicalStrokeCount = RADICAL_VARIANT_STROKES[radical] ?? RADICAL_STROKES[radical] ?? 0;
  const position = RADICAL_POSITION[char] || 'first'; // 沒資料時退回前N筆的近似值
  HanziWriter.loadCharacterData(char).then(charData=>{
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS,'svg');
    svg.setAttribute('viewBox','0 0 1024 1024');
    svg.setAttribute('width','140'); svg.setAttribute('height','140');
    target.appendChild(svg);

    const total = charData.strokes.length;
    charData.strokes.forEach((strokePath, i)=>{
      const path = document.createElementNS(svgNS,'path');
      path.setAttribute('d', strokePath);
      path.setAttribute('transform','translate(0,900) scale(1,-1)');
      let isRadical;
      if(position === 'whole'){
        isRadical = true;
      } else if(position === 'last'){
        isRadical = i >= (total - radicalStrokeCount);
      } else {
        isRadical = i < radicalStrokeCount;
      }
      let color = isRadical ? '#3B82C4' : '#2E9E6C'; // 藍＝部首，綠＝其餘
      if(i === 0) color = '#E0554F'; // 第一筆特別標示＝紅（優先於藍/綠）
      path.setAttribute('fill', color);
      path.style.opacity = '0';
      path.style.transition = 'opacity 0.4s';
      svg.appendChild(path);
      setTimeout(()=>{ path.style.opacity = '1'; }, i*350);
    });
  }).catch(()=>{
    target.innerHTML = `<div style="font-size:100px;line-height:140px;">${char}</div>`;
  });
}

// ====== 發音 ======
function speakText(text){
  if(!('speechSynthesis' in window)) return;
  const utter = new SpeechSynthesisUtterance(text);
  const voices = speechSynthesis.getVoices();
  const zhVoice = voices.find(v=>v.lang==='zh-TW') || voices.find(v=>v.lang && v.lang.startsWith('zh'));
  if(zhVoice) utter.voice = zhVoice;
  utter.lang = 'zh-TW';
  speechSynthesis.speak(utter);
}
